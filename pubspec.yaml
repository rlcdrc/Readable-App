name: readable_v2
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.0.7  
  path_provider: ^2.1.2  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4 # Use the latest version you had

flutter:
  uses-material-design: true
  assets:
    - assets/arts/
    - assets/history/
    - assets/science/
    - assets/english/
    - assets/math/
    - assets/reading/
    - assets/logo.png
    - assets/grow_daily.png
    - assets/understand.png

# Keep this at the very bottom, outside of the 'flutter' block
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png" # Changed this to use your existing logo!
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo.png"